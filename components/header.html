<header class="container navbar">

    <!-- LOGO -->

    <a
        href="/"
        class="logo"
        id="siteLogo"
        aria-label="ToolFlow Home"
    >
        <img
            src=""
            class="logo-image"
            id="siteLogoImage"
            alt="DTools"
        >

        <span class="logo-text">
            D<span>Tools</span>
        </span>
    </a>


    <!-- NAVIGATION -->

    <nav class="nav-links">

        <a href="#">Home</a>

        <a href="#">Tools</a>

        <a href="#">Features</a>

        <a href="#">Pricing</a>

        <a href="#">Contact</a>

    </nav>


    <!-- RIGHT -->

    <div class="nav-right">


        <!-- SEARCH BUTTON -->

        <button
            class="header-search-btn"
            id="toolSearchButton"
            type="button"
            aria-label="Search tools"
            title="Search tools"
        >

            <span class="material-icons">
                search
            </span>

        </button>


        <!-- THEME BUTTON -->

        <button
            class="theme-btn"
            id="themeToggle"
            type="button"
            aria-label="Toggle dark mode"
            title="Toggle dark mode"
        >

            <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
            >

                <path
                    d="M21 12.79A9 9 0 1111.21 3
                    7 7 0 0021 12.79z"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </svg>

        </button>


        <!-- START FREE -->

        <button
            class="primary-btn"
            id="startFreeButton"
            type="button"
        >
            Start Free
        </button>


    </div>

</header>


<!-- =========================================
     TOOL SEARCH OVERLAY
========================================= -->

<div
    class="tool-search-overlay"
    id="toolSearchOverlay"
    aria-hidden="true"
>


    <div
        class="tool-search-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="toolSearchTitle"
    >


        <!-- SEARCH HEADER -->

        <div class="tool-search-header">


            <div class="tool-search-input-wrap">

                <span class="material-icons">
                    search
                </span>


                <input
                    type="search"
                    id="toolSearchInput"
                    class="tool-search-input"
                    placeholder="Search tools..."
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Search tools"
                >

            </div>


            <button
                type="button"
                class="tool-search-close"
                id="toolSearchClose"
                aria-label="Close search"
                title="Close"
            >

                <span class="material-icons">
                    close
                </span>

            </button>


        </div>


        <!-- SEARCH RESULTS -->

        <div
            class="tool-search-results"
            id="toolSearchResults"
        >

            <div
                class="tool-search-empty"
                id="toolSearchEmpty"
            >

                <span class="material-icons">
                    search
                </span>

                <p>
                    Search for a tool by name or description.
                </p>

            </div>

        </div>


    </div>

</div>
