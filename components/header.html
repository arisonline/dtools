<header class="container navbar">

    <!-- LOGO -->

    <a
        href="/"
        class="logo"
        id="siteLogo"
        aria-label="ToolFlow Home"
    >
        <img
            src=""
            class="logo-image"
            id="siteLogoImage"
            alt="DTools"
        >

        <span class="logo-text">
            D<span>Tools</span>
        </span>
    </a>


    <!-- NAVIGATION -->

    <nav class="nav-links">

        <a href="#">Home</a>

        <a href="#">Tools</a>

        <a href="#">Features</a>

        <a href="#">Pricing</a>

        <a href="#">Contact</a>

    </nav>


    <!-- RIGHT -->

    <div class="nav-right">


        <!-- SEARCH BUTTON -->

        <button
            class="header-search-btn"
            id="toolSearchButton"
            type="button"
            aria-label="Search tools"
            title="Search tools"
        >

            <span class="material-icons">
                search
            </span>

        </button>


        <!-- THEME BUTTON -->

        <button
            class="theme-btn"
            id="themeToggle"
            type="button"
            aria-label="Toggle dark mode"
            title="Toggle dark mode"
        >

            <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
            >

                <path
                    d="M21 12.79A9 9 0 1111.21 3
                    7 7 0 0021 12.79z"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </svg>

        </button>


        <!-- START FREE -->

        <button
            class="primary-btn"
            id="startFreeButton"
            type="button"
        >
            Start Free
        </button>


    </div>

</header>




<div
    class="dtools-auth-overlay"
    id="startFreeModal"
    aria-hidden="true"
>
    <div
        class="dtools-auth-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="startFreeTitle"
    >

        <button
            type="button"
            class="dtools-auth-close"
            id="startFreeClose"
            aria-label="Close"
        >
            <span class="material-icons">close</span>
        </button>

        <div class="dtools-auth-header">

            <div class="dtools-auth-icon">
                <span class="material-icons">person_add</span>
            </div>

            <div>
                <h2 id="startFreeTitle">
                    Create your free DTools account
                </h2>

                <p>
                    Save your preferences and get relevant DTools updates.
                </p>
            </div>

        </div>

        <form id="startFreeForm" novalidate>

            <label class="dtools-auth-label">
                Full name
            </label>

            <input
                class="dtools-auth-input"
                id="startFreeName"
                type="text"
                placeholder="Your name"
                required
            >

            <label class="dtools-auth-label">
                Email
            </label>

            <input
                class="dtools-auth-input"
                id="startFreeEmail"
                type="email"
                placeholder="you@example.com"
                required
            >

            <label class="dtools-auth-label">
                Password
            </label>

            <input
                class="dtools-auth-input"
                id="startFreePassword"
                type="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >

            <div class="dtools-auth-label">
                What are you interested in?
            </div>

            <div class="dtools-interest-grid">

                <label class="dtools-check">
                    <input type="checkbox" name="interest" value="image">
                    <span>Image Tools</span>
                </label>

                <label class="dtools-check">
                    <input type="checkbox" name="interest" value="pdf">
                    <span>PDF Tools</span>
                </label>

                <label class="dtools-check">
                    <input type="checkbox" name="interest" value="dev">
                    <span>Developer Tools</span>
                </label>

                <label class="dtools-check">
                    <input type="checkbox" name="interest" value="color">
                    <span>Color Tools</span>
                </label>

                <label class="dtools-check">
                    <input type="checkbox" name="interest" value="seo">
                    <span>SEO / Marketing</span>
                </label>

                <label class="dtools-check">
                    <input type="checkbox" name="interest" value="productivity">
                    <span>Productivity</span>
                </label>

            </div>

            <label class="dtools-consent">
                <input
                    type="checkbox"
                    id="startFreeTerms"
                    required
                >
                <span>
                    I agree to the
                    <a href="#" id="startFreePrivacyLink">
                        Privacy Policy
                    </a>
                    and
                    <a href="#" id="startFreeTermsLink">
                        Terms & Conditions
                    </a>.
                </span>
            </label>

            <label class="dtools-consent">
                <input
                    type="checkbox"
                    id="startFreeMarketing"
                >
                <span>
                    Send me DTools offers, updates and promotions.
                </span>
            </label>

            <label class="dtools-consent">
                <input
                    type="checkbox"
                    id="startFreePartner"
                >
                <span>
                    Send me relevant offers from selected DTools partners.
                </span>
            </label>

            <div
                class="dtools-auth-status"
                id="startFreeStatus"
                role="status"
                aria-live="polite"
            ></div>

            <button
                class="primary-btn dtools-auth-submit"
                id="startFreeSubmit"
                type="submit"
            >
                Create Free Account
            </button>

        </form>

    </div>
</div>




<!-- =========================================
     ACCOUNT VIEW
========================================= -->

<div
    id="dtoolsAccountView"
    style="display:none;"
>

    <div class="dtools-account-box">

        <div class="dtools-account-avatar">
            <span class="material-icons">
                person
            </span>
        </div>

        <h3 id="dtoolsAccountName">
            DTools User
        </h3>

        <p id="dtoolsAccountEmail">
            user@example.com
        </p>

    </div>


    <button
        type="button"
        class="primary-btn dtools-logout-button"
        id="dtoolsLogoutButton"
    >
        Sign Out
    </button>

</div>





<!-- =========================================
     TOOL SEARCH OVERLAY
========================================= -->

<div
    class="tool-search-overlay"
    id="toolSearchOverlay"
    aria-hidden="true"
>


    <div
        class="tool-search-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="toolSearchTitle"
    >


        <!-- SEARCH HEADER -->

        <div class="tool-search-header">


            <div class="tool-search-input-wrap">

                <span class="material-icons">
                    search
                </span>


                <input
                    type="search"
                    id="toolSearchInput"
                    class="tool-search-input"
                    placeholder="Search tools..."
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Search tools"
                >

            </div>


            <button
                type="button"
                class="tool-search-close"
                id="toolSearchClose"
                aria-label="Close search"
                title="Close"
            >

                <span class="material-icons">
                    close
                </span>

            </button>


        </div>


        <!-- SEARCH RESULTS -->

        <div
            class="tool-search-results"
            id="toolSearchResults"
        >

            <div
                class="tool-search-empty"
                id="toolSearchEmpty"
            >

                <span class="material-icons">
                    search
                </span>

                <p>
                    Search for a tool by name or description.
                </p>

            </div>

        </div>


    </div>

</div>
