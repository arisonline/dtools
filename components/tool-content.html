<section class="popular-tools-section">

    <div class="container">

        <div class="tool-content-layout">


            <!-- =====================================
                 LEFT SIDEBAR
            ====================================== -->

            <aside class="popular-tools">

                <div class="popular-box">

                    <div class="popular-title">
                        Popular Tools
                    </div>


                    <div
                        class="popular-links"
                        id="popular-tools-links"
                    >
                        <!-- Generated automatically from toolsData -->
                    </div>


                    <a
                        href="/tools/"
                        class="view-all-tools"
                    >
                        View All Tools →
                    </a>

                </div>

            </aside>



            <!-- =====================================
                 RIGHT CONTENT
            ====================================== -->

            <section class="tool-content-section">

                <div class="tool-main-content">

                    <div class="tool-content-box">


                        <!-- =================================
                             TOOL HEADER
                        ================================== -->

                        <div class="tool-page-header">


                            <div
                                class="tool-page-icon blue"
                                id="tool-page-icon"
                            >
                                <span class="material-icons">
                                    build
                                </span>
                            </div>


                            <div>

                                <h1
                                    class="tool-page-title"
                                    id="tool-page-title"
                                ></h1>


                                <p
                                    class="tool-page-description"
                                    id="tool-page-description"
                                ></p>

                            </div>

                        </div>



                        <!-- =================================
                             CATEGORY
                        ================================== -->

                        <div
                            class="tool-page-categories"
                            id="tool-page-categories"
                        ></div>



                        <!-- =================================
                             ACTUAL TOOL CONTENT
                        ================================== -->

                        <div
                            id="tool-content"
                            class="tool-article"
                        ></div>



                        <!-- =================================
                             HOW TO
                        ================================== -->

                        <div
                            class="tool-content-block"
                            id="tool-howto-block"
                        >

                            <h2 id="tool-howto-title">
                                How to Use This Tool?
                            </h2>


                            <ul
                                class="tool-guide-list"
                                id="tool-guide-list"
                            ></ul>

                        </div>



                        <!-- =================================
                             CREDITS
                        ================================== -->

                        <div
                            class="tool-content-block"
                            id="tool-credits-section"
                        >

                            <h2>
                                Credits
                            </h2>


                            <div
                                class="tool-credits"
                                id="tool-credits"
                            ></div>

                        </div>



                        <!-- =================================
                             SHARE
                        ================================== -->

                        <div class="tool-share">


                            <button
                                class="share-btn"
                                type="button"
                                id="share-facebook"
                            >

                                <svg
                                    width="16"
                                    height="16"
                                    viewBox="0 0 24 24"
                                    fill="currentColor"
                                >

                                    <path d="M22 12a10 10 0 10-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.5-3.88 3.78-3.88 1.1 0 2.24.2 2.24.2v2.46H15.2c-1.24 0-1.62.77-1.62 1.56V12h2.76l-.44 2.89h-2.32v6.99A10 10 0 0022 12z"/>

                                </svg>

                                Share

                            </button>



                            <button
                                class="share-btn"
                                type="button"
                                id="share-twitter"
                            >

                                <svg
                                    width="16"
                                    height="16"
                                    viewBox="0 0 24 24"
                                    fill="currentColor"
                                >

                                    <path d="M22 5.92c-.77.35-1.6.58-2.46.69a4.3 4.3 0 001.88-2.37 8.59 8.59 0 01-2.72 1.04 4.28 4.28 0 00-7.3 3.9A12.13 12.13 0 013 4.79a4.28 4.28 0 001.32 5.71 4.24 4.24 0 01-1.94-.54v.05a4.28 4.28 0 003.43 4.2 4.29 4.29 0 01-1.93.07 4.29 4.29 0 004 2.98A8.6 8.6 0 012 19.54a12.12 12.12 0 006.56 1.92c7.88 0 12.2-6.53 12.2-12.2v-.56A8.7 8.7 0 0022 5.92z"/>

                                </svg>

                                Tweet

                            </button>


                        </div>


                    </div>

                </div>

            </section>


        </div>

    </div>

</section>
