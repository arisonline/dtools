<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Percentage Calculator - Dozni Tools
    </title>


    <meta
        name="description"
        content="Free online percentage calculator to calculate percentage amounts, principal amounts and percentage rates instantly."
    >


    <meta
        name="robots"
        content="index, follow"
    >


    <link
        rel="canonical"
        href="https://dtools.dozni.com/tools/percentage-calculator/"
    >


    <!-- Material Icons -->

    <link
        href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet"
    >


    <!-- Global Theme -->

    <link
        rel="stylesheet"
        href="../../assets/css/theme.css"
    >


    <!-- Universal Tool CSS -->

    <link
        rel="stylesheet"
        href="../../assets/css/percentage-calculator.css"
    >


</head>


<body
    class="tool-page"
    data-tool="percentage-calculator"
>


    <!-- =========================================
         HEADER
    ========================================== -->

    <div id="site-header"></div>



    <!-- =========================================
         PERCENTAGE CALCULATOR
    ========================================== -->

    <main>


        <section class="percentage-calculator-page">

            <div class="percentage-calculator-container">


                <div class="percentage-calculator-card">


                    <div class="percentage-calculator-heading">

                        <h2>
                            Percentage Calculator
                        </h2>

                        <p>
                            Calculate percentages, percentage rates
                            and original amounts instantly.
                        </p>

                    </div>



                    <!-- =================================
                         1. X% OF Y
                    ================================== -->

                    <div class="percentage-calculation">

                        <div class="percentage-question">

                            <span>Find</span>
                        
                            <input
                                type="number"
                                id="percent1"
                                placeholder="%"
                                inputmode="decimal"
                            >
                        
                            <span>% of</span>
                        
                            <input
                                type="number"
                                id="number1"
                                placeholder="Y"
                                inputmode="decimal"
                            >
                        
                        </div>


                        <div
                            class="percentage-answer"
                            id="valueOut"
                        >
                            0
                        </div>


                        <div
                            class="percentage-result-text"
                            id="resultText1"
                        >
                            Enter values above
                        </div>


                        <div
                            class="calculation-box"
                            id="calculation1"
                        ></div>

                    </div>



                    <!-- =================================
                         2. WHAT % IS X OF Y
                    ================================== -->

                    <div class="percentage-calculation">

                        <div class="percentage-question">

                            <span>Find what % of</span>
                        
                            <input
                                type="number"
                                id="number2"
                                placeholder="X"
                                inputmode="decimal"
                            >
                        
                            <span>is</span>
                        
                            <input
                                type="number"
                                id="value2"
                                placeholder="Y"
                                inputmode="decimal"
                            >
                        
                        </div>


                        <div
                            class="percentage-answer"
                            id="percentOut"
                        >
                            0%
                        </div>


                        <div
                            class="percentage-result-text"
                            id="resultText2"
                        >
                            Enter values above
                        </div>


                        <div
                            class="calculation-box"
                            id="calculation2"
                        ></div>

                    </div>



                    <!-- =================================
                         3. X IS Y% OF WHAT
                    ================================== -->

                    <div class="percentage-calculation">

                        <div class="percentage-question">

                            <input
                                type="number"
                                id="value3"
                                placeholder="X"
                                inputmode="decimal"
                            >
                        
                            <span>is</span>
                        
                            <input
                                type="number"
                                id="percent3"
                                placeholder="%"
                                inputmode="decimal"
                            >
                        
                            <span>% of what?</span>
                        
                        </div>


                        <div
                            class="percentage-answer"
                            id="numberOut"
                        >
                            0
                        </div>


                        <div
                            class="percentage-result-text"
                            id="resultText3"
                        >
                            Enter values above
                        </div>


                        <div
                            class="calculation-box"
                            id="calculation3"
                        ></div>

                    </div>


                </div>

            </div>

        </section>



        <!-- =========================================
             UNIVERSAL TOOL CONTENT
        ========================================== -->

        <div id="tool-content-component"></div>



        <!-- =========================================
             FEATURES
        ========================================== -->

        <div id="features"></div>



        <!-- =========================================
             RELATED TOOLS
        ========================================== -->

        <div id="related-tools"></div>



        <!-- =========================================
             FAQ
        ========================================== -->

        <div id="faq"></div>


    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <div id="site-footer"></div>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script
        src="../../assets/js/percentage-calculator.js"
    ></script>


    <script
        src="../../assets/js/tools.js"
    ></script>


    <script
        src="../../assets/js/components.js"
    ></script>


</body>

</html>
