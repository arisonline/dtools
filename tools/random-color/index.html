<body
    class="tool-page random-color-tool-page"
    data-tool="random-color"
>


    <!-- Shared Header -->
    <div id="site-header"></div>


    <main>


        <!-- =====================================================
             TOOL
             ===================================================== -->

        <section class="random-color-page">

            <div class="random-color-container">

                <div class="random-color-card">


                    <!-- Tool Header -->

                    <div class="random-color-header">

                        <h1>
                            Random Color Generator
                        </h1>

                        <p>
                            Generate a random color and get its HEX, RGB,
                            HSL and HSV values instantly.
                        </p>

                    </div>


                    <!-- Main Tool -->

                    <div class="random-color-tool">


                        <!-- Color Preview -->

                        <div class="random-color-preview-section">

                            <div
                                id="colorBox"
                                class="random-color-preview"
                                title="Click to copy HEX color"
                            ></div>

                            <p class="random-color-copy-hint">
                                Click the color to copy HEX
                            </p>

                        </div>


                        <!-- Color Values -->

                        <div class="random-color-values">


                            <div class="random-color-value-row">

                                <label for="hexOutput">
                                    HEX
                                </label>

                                <input
                                    type="text"
                                    id="hexOutput"
                                    readonly
                                >

                            </div>


                            <div class="random-color-value-row">

                                <label for="rgbOutput">
                                    RGB
                                </label>

                                <input
                                    type="text"
                                    id="rgbOutput"
                                    readonly
                                >

                            </div>


                            <div class="random-color-value-row">

                                <label for="hslOutput">
                                    HSL
                                </label>

                                <input
                                    type="text"
                                    id="hslOutput"
                                    readonly
                                >

                            </div>


                            <div class="random-color-value-row">

                                <label for="hsvOutput">
                                    HSV
                                </label>

                                <input
                                    type="text"
                                    id="hsvOutput"
                                    readonly
                                >

                            </div>


                            <p class="random-color-click-hint">
                                Click a color value to copy it
                            </p>

                        </div>

                    </div>


                    <!-- Generate -->

                    <div class="random-color-actions">

                        <button
                            type="button"
                            id="generateBtn"
                            class="random-color-generate-button"
                        >
                            <span class="material-icons">
                                refresh
                            </span>

                            New Random Color
                        </button>

                    </div>


                    <!-- Related Color Tool -->

                    <div class="random-color-related">

                        <span>
                            Work with this color:
                        </span>

                        <a href="../color-shades/">
                            Get Shades
                        </a>

                    </div>


                </div>

            </div>
