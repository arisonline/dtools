<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JSON Viewer - Dozni</title>

    <meta
        name="description"
        content="View, format and explore JSON data online with JSON Viewer."
    >


    <!-- Material Icons -->
    <link
        href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet"
    >


    <!-- JSONEditor -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/5.32.2/jsoneditor.min.css"
    >


    <!-- Site CSS -->
    <link
        rel="stylesheet"
        href="../../assets/css/theme.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/tools.css"
    >


    <!-- JSON Viewer CSS -->
    <!-- MUST BE LAST -->
    <link
        rel="stylesheet"
        href="../../assets/css/json-viewer.css"
    >

</head>


<body
    class="tool-page json-viewer-tool-page"
    data-tool="json-viewer"
>


    <!-- HEADER -->
    <div id="site-header"></div>


    <main>


        <!-- =================================================
             JSON VIEWER
             ================================================= -->

        <section class="json-viewer-page">

            <div class="json-viewer-container">


                <!-- URL / MAIN TOOL CARD -->
                <div class="json-viewer-card">


                    <!-- ================================
                         URL INPUT
                         ================================ -->

                    <div class="json-viewer-input-area">

                        <label for="urlInput">
                            Enter JSON URL:
                        </label>


                        <div class="json-url-row">

                            <input
                                type="url"
                                id="urlInput"
                                spellcheck="false"
                                autocomplete="off"
                                placeholder="https://www.dozni.com/example.json"
                            >


                            <button
                                type="button"
                                id="loadUrlButton"
                                class="json-load-button"
                            >
                                Load
                            </button>

                        </div>


                        <label
                            for="manualInput"
                            class="json-manual-label"
                        >
                            Or Paste Manual JSON below
                        </label>

                    </div>


                    <!-- ================================
                         INPUT + OUTPUT
                         45% / 55%
                         ================================ -->

                    <div class="json-viewer-editor-layout">


                        <!-- ============================
                             LEFT : INPUT
                             ============================ -->

                        <div class="json-viewer-input-panel">

                            <textarea
                                id="manualInput"
                                class="json-manual-input"
                                spellcheck="false"
                                placeholder="Enter JSON data here..."
                            >{
  "id": 1001,
  "type": "donut",
  "name": "Cake",
  "description": "http://en.wikipedia.org/wiki/Doughnut",
  "price": 2.55,
  "available": {
    "store": 42,
    "warehouse": 600
  },
  "topping": [
    {
      "id": 5001,
      "type": "None"
    },
    {
      "id": 5002,
      "type": "Glazed"
    },
    {
      "id": 5005,
      "type": "Sugar"
    },
    {
      "id": 5003,
      "type": "Chocolate"
    },
    {
      "id": 5004,
      "type": "Maple"
    }
  ]
}</textarea>

                        </div>


                        <!-- ============================
                             RIGHT : OUTPUT
                             ============================ -->

                        <div class="json-viewer-output-panel">

                            <div
                                id="jsoneditor"
                                class="json-editor-container"
                            ></div>

                        </div>


                    </div>


                    <!-- ================================
                         ERROR
                         ================================ -->

                    <div
                        id="jsonViewerError"
                        class="json-viewer-error"
                        aria-live="polite"
                    ></div>


                </div>

            </div>

        </section>


        <!-- =================================================
             SHARED TOOL CONTENT
             ================================================= -->

        <div id="tool-content-component"></div>

        <div id="features"></div>

        <div id="related-tools"></div>

        <div id="faq"></div>


    </main>


    <!-- FOOTER -->
    <div id="site-footer"></div>


    <!-- =================================================
         JSONEDITOR
         ================================================= -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/5.32.2/jsoneditor.min.js">
    </script>


    <!-- JSON VIEWER JS -->
    <script
        src="../../assets/js/json-viewer.js">
    </script>


    <!-- UNIVERSAL TOOLS JS -->
    <script
        src="../../assets/js/tools.js">
    </script>


    <!-- COMPONENTS -->
    <script
        src="../../assets/js/components.js">
    </script>


</body>
</html>
