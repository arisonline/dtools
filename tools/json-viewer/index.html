<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JSON Viewer Online - View & Format JSON Data | Dozni</title>

    <meta name="description"
          content="View, format and explore JSON data online with Dozni JSON Viewer. Paste JSON or load JSON from a URL and inspect it in a collapsible tree view.">

    <meta name="robots"
          content="index, follow">

    <link rel="canonical"
          href="https://dtools.dozni.com/tools/json-viewer/">

    <!-- Material Icons -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <!-- JSONEditor 5.32.2 -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/5.32.2/jsoneditor.min.css">

    <!-- Global CSS -->
    <link rel="stylesheet"
          href="../../assets/css/theme.css">

    <link rel="stylesheet"
          href="../../assets/css/tools.css">

    <!-- Tool CSS -->
    <link rel="stylesheet"
          href="../../assets/css/json-viewer.css">
</head>

<body class="tool-page json-viewer-tool-page"
      data-tool="json-viewer">

    <!-- Shared Header -->
    <div id="site-header"></div>

    <main>

        <!-- JSON Viewer Tool -->
        <section class="json-viewer-page">

            <div class="json-viewer-container">

                <div class="json-viewer-card">

                    <!-- URL Input -->
                    <div class="json-viewer-input-area">

                        <label for="urlInput">
                            Enter JSON URL:
                        </label>

                        <div class="json-url-row">

                            <input
                                type="url"
                                id="urlInput"
                                autocomplete="off"
                                spellcheck="false"
                                placeholder="https://example.com/data.json"
                            >

                            <button
                                type="button"
                                id="loadUrlButton"
                                class="json-load-button"
                            >
                                Load
                            </button>

                        </div>

                        <label
                            for="manualInput"
                            class="json-manual-label"
                        >
                            Or Paste Manual JSON below
                        </label>

                    </div>


                    <!-- Editor -->
                    <div class="json-viewer-editor-layout">

                        <!-- Input -->
                        <div class="json-viewer-input-panel">

                            <textarea
                                id="manualInput"
                                class="json-manual-input"
                                spellcheck="false"
                                placeholder="Enter JSON data here..."
                            >{
    "name": "Dozni",
    "website": "https://dozni.com",
    "tools": [
        "JSON Viewer",
        "Screen Resolution",
        "Browser Resolution"
    ],
    "active": true
}</textarea>

                        </div>


                        <!-- Output -->
                        <div class="json-viewer-output-panel">

                            <div
                                id="jsoneditor"
                                class="json-editor-container"
                            ></div>

                        </div>

                    </div>


                    <!-- Error -->
                    <div
                        id="jsonViewerError"
                        class="json-viewer-error"
                        aria-live="polite"
                    ></div>

                </div>

            </div>

        </section>


        <!-- Shared Tool Content -->
        <div id="tool-content-component"></div>

        <div id="features"></div>

        <div id="related-tools"></div>

        <div id="faq"></div>

    </main>


    <!-- Shared Footer -->
    <div id="site-footer"></div>


    <!-- JSONEditor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/5.32.2/jsoneditor.min.js"></script>

    <!-- Tool JS -->
    <script src="../../assets/js/json-viewer.js"></script>

    <!-- Universal Tools -->
    <script src="../../assets/js/tools.js"></script>

    <!-- Components -->
    <script src="../../assets/js/components.js"></script>

</body>

</html>
